<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noir Proof Verification</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Noir Proof Verification</h1>
    <form id="proofForm">
        <label for="secretX">Secret X:</label>
        <input type="number" id="secretX" name="secretX" required>
        <label for="publicOutput">Public Output:</label>
        <input type="number" id="publicOutput" name="publicOutput" required>
        <button type="submit">Generate Proof</button>
    </form>
    <div id="result"></div>
</body>
</html>
